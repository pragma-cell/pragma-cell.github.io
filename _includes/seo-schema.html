<!-- Local Business Schema for SEO -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "{{ site.title }}",
  "description": "{{ site.description }}",
  "url": "{{ site.url }}",
  "logo": "{{ site.url }}{{ site.logo }}",
  "image": "{{ site.url }}/assets/images/og-image.jpg",
  "telephone": "{{ site.author.phone }}",
  "email": "{{ site.author.email }}",
  "priceRange": "$$",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Rue de Huy 129",
    "addressLocality": "Hannut",
    "postalCode": "4280",
    "addressRegion": "Liège",
    "addressCountry": "BE"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": "50.6703",
    "longitude": "5.0803"
  },
  "openingHoursSpecification": {
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": [
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday"
    ],
    "opens": "09:00",
    "closes": "18:00"
  },
  "sameAs": {{ site.social.links | jsonify }},
  "areaServed": {
    "@type": "GeoCircle",
    "geoMidpoint": {
      "@type": "GeoCoordinates",
      "latitude": "50.6703",
      "longitude": "5.0803"
    },
    "geoRadius": "50000"
  },
  "serviceType": [
    "Conseil en transformation numérique",
    "Audit informatique",
    "Développement logiciel sur mesure",
    "Formation digitale",
    "Accompagnement PME",
    "Stratégie digitale"
  ],
  "knowsAbout": [
    "Digitalisation PME",
    "Transformation numérique",
    "CRM",
    "ERP",
    "Automatisation",
    "Cybersécurité",
    "RGPD",
    "Cloud Computing",
    "DevOps"
  ]
}
</script>

<!-- Breadcrumb Schema -->
{% if page.layout == 'post' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Accueil",
      "item": "{{ site.url }}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Blog",
      "item": "{{ site.url }}/blog/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{ page.title }}",
      "item": "{{ page.url | absolute_url }}"
    }
  ]
}
</script>
{% endif %}

<!-- FAQ Schema (if applicable) -->
{% if page.faq %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for item in page.faq %}
    {
      "@type": "Question",
      "name": "{{ item.question }}",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "{{ item.answer }}"
      }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{% endif %}
